site_name: Git-versionhallinta
site_author: Markku Ruonavaara
copyright: Markku Ruonavaara 2024-2026
nav:
  - johdanto.md
  - 'Paikallinen Git':
    - peruskaytto.md
    - haarat.md
  - 'Hajautettu Git':
    - etarepositoriot.md
    - hosting_palvelut.md
  - 'Git projektissa':
    - versionhallinta_projektissa.md
    - yhdistamispyynnot.md
  - muita_toimintoja.md
  - hosting_toimintoja.md
theme:
  name: materialx
  language: fi
  # topbar_style: primary
  palette: 
  # Palette toggle for light mode
  - scheme: default
    primary: indigo
    accent: indigo
    toggle:
      icon: material/brightness-7 
      name: Switch to dark mode
  # Palette toggle for dark mode
  - scheme: slate
    primary: cyan
    accent: cyan
    toggle:
      icon: material/brightness-4
      name: Switch to light mode
  features:
    - content.code.copy
    - content.code.select
    - toc.integrate
    - navigation.expand
    - navigation.footer
    - navigation.tabs
    # - navigation.tabs.sticky
extra_css:
  - stylesheets/extra.css
markdown_extensions:
  - toc:
      title: Sisällysluettelo
  - admonition
  - md_in_html
  - pymdownx.superfences
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.magiclink

