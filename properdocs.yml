site_name: Git-versionhallinta
site_author: Markku Ruonavaara
copyright: '  Copyright © 2024-2026 Markku Ruonavaara <a href="https://creativecommons.org/licenses/by-nc-sa/4.0/">CC BY-NC-SA 4.0</a>'
nav:
  - 'Opintojakso': index.md
  - introduction.md
  - basic_use.md
  - branches.md
  - 'Hajautettu Git':
    - remotes.md
    - hosting-services.md
  - 'Git projektissa':
    - distributed-workflows.md
    - pull-requests.md
  - other-git-functions.md
  - hosting-features.md
theme:
  name: materialx
  # topbar_style: accent
  palette: 
  # Palette toggle for light mode
  - scheme: default
    toggle:
      icon: material/brightness-7 
      name: Switch to dark mode
  # Palette toggle for dark mode
  - scheme: slate
    toggle:
      icon: material/brightness-4
      name: Switch to light mode
  features:
    - content.code.copy
    - content.code.select
    - toc.integrate
    - navigation.footer
    - navigation.tabs
    - content.footnote.tooltips
    # - navigation.tabs.sticky
plugins:
  - i18n:
      docs_structure: folder
      languages:
        - locale: fi
          default: true
          name: Suomi
          build: true
          theme:
            language: fi
        - locale: en
          name: English
          build: true
          site_name: Git Version Control
          nav_translations:
            'Opintojakso': 'Course'
            'Hajautettu Git': 'Distributed Git'
            'Git projektissa': Git in a project
          theme:
            language: en
      reconfigure_material: true
      reconfigure_search: true
extra:
  alternate:
    - name: Suomi
      link: / 
      lang: fi
    - name: English
      link: /en/
      lang: en
extra_css:
  - stylesheets/extra.css
markdown_extensions:
  - admonition
  - md_in_html
  - pymdownx.superfences
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.magiclink
  - footnotes

